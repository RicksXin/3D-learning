<svg width="980" height="520" viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box{fill:#f7f9fc;stroke:#344054;stroke-width:1.4;rx:8}
    .core{fill:#e8f2ff;stroke:#175cd3}
    .sys{fill:#ecfdf3;stroke:#067647}
    .net{fill:#fff4e5;stroke:#b54708}
    .txt{font:14px Arial,"Microsoft YaHei",sans-serif;fill:#101828}
    .small{font:12px Arial,"Microsoft YaHei",sans-serif;fill:#475467}
    .line{stroke:#667085;stroke-width:1.5;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect x="390" y="20" width="200" height="54" class="box core"/>
  <text x="490" y="43" text-anchor="middle" class="txt">开放世界主循环</text>
  <text x="490" y="62" text-anchor="middle" class="small">main.js / render loop</text>

  <rect x="50" y="110" width="190" height="78" class="box core"/>
  <text x="145" y="135" text-anchor="middle" class="txt">1-4 基础场景</text>
  <text x="145" y="157" text-anchor="middle" class="small">场景、相机、灯光、地面</text>
  <text x="145" y="175" text-anchor="middle" class="small">墙体、障碍、玩家模型</text>

  <rect x="285" y="110" width="190" height="78" class="box core"/>
  <text x="380" y="135" text-anchor="middle" class="txt">5-12 玩家系统</text>
  <text x="380" y="157" text-anchor="middle" class="small">Cannon 物理、WASD</text>
  <text x="380" y="175" text-anchor="middle" class="small">跳跃、碰撞、动画、音效</text>

  <rect x="520" y="110" width="190" height="78" class="box"/>
  <text x="615" y="135" text-anchor="middle" class="txt">13-18 建筑交互</text>
  <text x="615" y="157" text-anchor="middle" class="small">房子、门、窗、电脑</text>
  <text x="615" y="175" text-anchor="middle" class="small">CSS3D 屏幕视角</text>

  <rect x="755" y="110" width="190" height="78" class="box"/>
  <text x="850" y="135" text-anchor="middle" class="txt">19-24 载具系统</text>
  <text x="850" y="157" text-anchor="middle" class="small">汽车、飞机、上下车</text>
  <text x="850" y="175" text-anchor="middle" class="small">载具相机、音效、物理同步</text>

  <rect x="50" y="245" width="190" height="78" class="box"/>
  <text x="145" y="270" text-anchor="middle" class="txt">25-30 场景内容</text>
  <text x="145" y="292" text-anchor="middle" class="small">NPC、对话、跳舞</text>
  <text x="145" y="310" text-anchor="middle" class="small">镜屋、鸟群、环境物件</text>

  <rect x="285" y="245" width="190" height="78" class="box sys"/>
  <text x="380" y="270" text-anchor="middle" class="txt">31-36 UI 辅助</text>
  <text x="380" y="292" text-anchor="middle" class="small">加载、提示、设置</text>
  <text x="380" y="310" text-anchor="middle" class="small">手册、小地图、全屏地图</text>

  <rect x="520" y="245" width="190" height="78" class="box sys"/>
  <text x="615" y="270" text-anchor="middle" class="txt">37-42 体验系统</text>
  <text x="615" y="292" text-anchor="middle" class="small">天气、粒子、背景音乐</text>
  <text x="615" y="310" text-anchor="middle" class="small">音效开关、存档读档</text>

  <rect x="755" y="245" width="190" height="78" class="box net"/>
  <text x="850" y="270" text-anchor="middle" class="txt">43-48 联网收尾</text>
  <text x="850" y="292" text-anchor="middle" class="small">注册登录、JWT</text>
  <text x="850" y="310" text-anchor="middle" class="small">Socket.IO、远端玩家同步</text>

  <rect x="285" y="395" width="190" height="70" class="box"/>
  <text x="380" y="423" text-anchor="middle" class="txt">开发流程总结</text>
  <text x="380" y="445" text-anchor="middle" class="small">拆模块、逐步可运行</text>

  <rect x="520" y="395" width="190" height="70" class="box"/>
  <text x="615" y="423" text-anchor="middle" class="txt">技术总结</text>
  <text x="615" y="445" text-anchor="middle" class="small">Three.js + Cannon + Socket.IO</text>

  <line x1="490" y1="74" x2="145" y2="110" class="line"/>
  <line x1="490" y1="74" x2="380" y2="110" class="line"/>
  <line x1="490" y1="74" x2="615" y2="110" class="line"/>
  <line x1="490" y1="74" x2="850" y2="110" class="line"/>
  <line x1="145" y1="188" x2="145" y2="245" class="line"/>
  <line x1="380" y1="188" x2="380" y2="245" class="line"/>
  <line x1="615" y1="188" x2="615" y2="245" class="line"/>
  <line x1="850" y1="188" x2="850" y2="245" class="line"/>
  <line x1="380" y1="323" x2="380" y2="395" class="line"/>
  <line x1="615" y1="323" x2="615" y2="395" class="line"/>
</svg>
